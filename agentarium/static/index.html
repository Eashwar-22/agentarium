<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Inspect your workflow runs, results, and tool activity.">
<title>Agentarium</title>
<link rel="stylesheet" href="/styles.css?v=30">
<script src="/run_view.js?v=22" defer></script>
<script src="/script.js?v=30" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="app-layout">
<aside class="sidebar">
<a class="brand" href="/" aria-label="Agentarium home"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7m-3.5-3.5v7"/></svg>Agentarium</a>
<div class="nav-label">WORKSPACE</div>
<nav class="tabs" aria-label="Run views">
<button class="selected" data-view="overview" aria-pressed="true"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="M3 8h14M8 8v9"/></svg>Overview</button>
<button data-view="trace" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5h10M7 10h10M7 15h10M3 5h.01M3 10h.01M3 15h.01"/></svg>Trace <span id="trace-count">0</span></button>
</nav>
<div class="sidebar-bottom"><span id="connection" role="status">Connecting</span><span class="local-note">Local workspace</span></div>
</aside>
<main class="shell" id="main">
<header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <strong>Current run</strong></div><div class="toolbar"><button id="theme">Dark theme</button><button id="download" class="primary">Export JSON <span aria-hidden="true">↓</span></button></div></header>
<section class="run-header"><div class="run-title"><span id="run-status" class="status">Waiting</span><details class="run-identifier"><summary>Run details</summary><code id="run-id">No run received</code></details></div><h1 id="question">Waiting for a workflow</h1><p id="run-context" class="muted">Start a workflow to see its activity here.</p></section>
<section class="metrics" aria-label="Run summary"><dl id="metrics"></dl></section>
<div class="workspace">
<section id="overview">
<div class="results-column">
<section class="panel result-panel"><div class="heading"><h2 id="work-title">Current work</h2><span id="active-count" class="count"></span></div><div id="active-work"></div></section>
<section class="panel"><div class="heading"><h2>Saved outputs</h2><span id="output-count" class="count"></span></div><div id="outputs"></div></section>
</div>
<div class="context-column">
<section class="panel"><div class="heading"><h2>Errors & retries</h2><span id="issue-count" class="count"></span></div><div id="issues"></div></section>
<section class="panel"><div class="heading"><h2>Sources</h2><span id="source-count" class="count"></span></div><div id="sources"></div></section>
</div>
</section>
<section id="trace" hidden class="panel">
<div class="heading trace-heading"><h2>Activity log</h2><div class="playback"><button id="replay">Replay</button><button id="pause">Pause display</button><button id="live" hidden>Return to live</button></div></div>
<div class="filters"><input id="search" type="search" placeholder="Search activity…" aria-label="Search trace"><select id="agent-filter" aria-label="Filter by agent"><option value="">All agents</option></select><select id="type-filter" aria-label="Filter by action"><option value="">All actions</option><option value="tool">Tools</option><option value="model">Model calls</option><option value="error">Errors</option><option value="artifact">Outputs</option><option value="task">Tasks</option><option value="handoff">Transfers</option></select></div>
<div class="trace-labels"><span>Time</span><span>Agent</span><span>Activity</span></div>
<div id="trace-list" class="trace-list" tabindex="0" aria-label="Scrollable activity log"></div><div class="trace-pagination"><p class="muted" id="trace-footer"></p><button id="trace-prev">Previous</button><button id="trace-next">Next</button></div>
</section>
</div>
</main>
</div>
<dialog id="detail-dialog" aria-labelledby="detail-title"><header class="dialog-header"><div><p id="detail-agent" class="muted"></p><h2 id="detail-title">Activity details</h2></div><button id="close-dialog" aria-label="Close details">Close <span aria-hidden="true">×</span></button></header><div class="dialog-tools"><button id="copy-detail">Copy JSON</button><button id="download-detail">Download JSON</button><span id="copy-status" role="status"></span></div><div id="detail-content" class="dialog-content"></div></dialog>
</body></html>
